name: Afternoon Dose (1:00 PM IST)

on:
  schedule:
    # 12:58 PM IST (07:28 UTC) - avoids top-of-hour congestion
    - cron: '28 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Post even if afternoon slot already posted today / outside window'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Preview output in logs without posting to Telegram'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post-afternoon:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and Post Afternoon Dose
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_CHAT_ID || '@sscstudyprephub' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          FLAGS=(--slot afternoon)
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS+=(--force)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          python -m src.main "${FLAGS[@]}"

      - name: Commit Updated Word History
        if: ${{ inputs.dry_run != true }}
        run: |
          if ! git diff --quiet data/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: update posted English history (afternoon) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to data/history.json."
          fi
