name: Catch-Up Guard (Auto-Retry Missed Slots)

on:
  schedule:
    # Checks at :17 across Morning (6:47-9:47 AM), Afternoon (12:47-3:47 PM), Evening (6:47-9:47 PM IST)
    - cron: '17 1,2,3,4,7,8,9,10,13,14,15,16 * * *'
    # Extra check 19 mins after target time (7:17 AM, 1:17 PM, 7:17 PM IST)
    - cron: '47 1,7,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssc-english-bot
  cancel-in-progress: false

jobs:
  catchup-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check If Active Slot Still Pending
        id: check
        shell: bash
        run: |
          DUE=$(python3 -c "
          import datetime, json
          ist = datetime.timezone(datetime.timedelta(hours=5, minutes=30))
          now = datetime.datetime.now(ist)
          date_iso = now.strftime('%Y-%m-%d')
          mins = now.hour * 60 + now.minute
          posted = set(json.load(open('data/history.json', encoding='utf-8')).get('posted_log', []))
          windows = [(405, 750, 'morning'), (765, 1110, 'afternoon'), (1125, 1440, 'evening')]
          print('true' if any(s <= mins < e and f'{date_iso}:{name}' not in posted for s, e, name in windows) else 'false')
          ")
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "Active slot still pending: $DUE"

      - name: Set up Python
        if: steps.check.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.check.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post Pending Slot
        if: steps.check.outputs.due == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_CHAT_ID || '@sscstudyprephub' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main --slot catchup

      - name: Commit Updated Word History
        if: steps.check.outputs.due == 'true'
        run: |
          if ! git diff --quiet data/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: update posted English history (catchup) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to data/history.json."
          fi
