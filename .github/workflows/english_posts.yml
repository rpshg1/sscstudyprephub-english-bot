name: SSC English 3x Daily Telegram Posts

on:
  schedule:
    # Morning Dose: 7:00 AM IST (01:30 UTC)
    - cron: '30 1 * * *'
    # Afternoon Dose: 1:00 PM IST (07:30 UTC)
    - cron: '30 7 * * *'
    # Evening Dose: 7:00 PM IST (13:30 UTC)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run (auto detects from IST time)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - afternoon
          - evening
      force:
        description: 'Post even if this slot already posted today'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Preview output in logs without posting to Telegram'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post-english-dose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Post Slot
        id: slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            echo "name=morning" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 7 * * *" ]; then
            echo "name=afternoon" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            echo "name=evening" >> "$GITHUB_OUTPUT"
          else
            echo "name=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and Post English Dose
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_CHAT_ID || '@sscstudyprephub' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FLAGS=(--slot "${{ steps.slot.outputs.name }}")
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS+=(--force)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          python -m src.main "${FLAGS[@]}"

      - name: Commit Updated Word History
        if: ${{ inputs.dry_run != true }}
        run: |
          if ! git diff --quiet data/history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "chore: update posted English history (${{ steps.slot.outputs.name }}) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          else
            echo "No changes to data/history.json."
          fi
